 (it.kode==='K-04'?`<label class="consent"><input type="checkbox" data-a="k4"${ST.k4agree?' checked':''}><span>Saya menyatakan bahwa jawaban pada kuesioner ini diisi sesuai kondisi sebenarnya dan bukti yang ditunjukkan kepada peneliti.</span></label>`:'')+
 (ERR?`<div class="er">${ERR}</div>`:'')+`</div>`}
function allHtml(){return`<div class="card"><span class="chip">Penelaahan Instrumen</span><h1 style="font-size:clamp(22px,5vw,30px)">${esc(D.judul)}</h1><p class="lead">${esc(CONFIG.tujuan)}</p>
 <div class="legend"><b>Y</b>Ya &nbsp;<b>T</b>Tidak &nbsp;<b>BDD</b>Belum Dapat Ditentukan &nbsp;<b>TB</b>Tidak Berlaku &nbsp;<b>★</b>Bukti utama yang diminta ditunjukkan kepada peneliti</div>
 <p class="note">Halaman ini menampilkan seluruh pertanyaan apa adanya untuk dibaca dan ditelaah sebelum mengisi.</p></div>`+
 SEC.map(x=>`<div class="card" style="margin-top:14px"><span class="chip">Bagian ${esc(x.b)}</span><h2 style="font-size:20px;margin:0 0 6px">${esc(x.t)}</h2>`+x.items.map(it=>{const gs=P(it);return`<div class="all-it"><span class="chip">${esc(it.kode_blanko||it.kode)}</span><div class="qq">${esc(it.pertanyaan)}</div>`+(gs.length?`<ul>`+gs.map(g=>{if(g.k==='opt')return g.opts.map(o=>`<li>${esc(X(o.l))}</li>`).join('');if(g.k==='fld')return g.fl.map(f=>`<li>${esc(f.l||g.lab||'Isian')}</li>`).join('');return`<li>Jawaban terbuka</li>`}).join('')+`</ul>`:'')+(it.bukti_diminta&&it.bukti_diminta!=='—'?`<div class="ev">Bukti yang diminta: ${esc(it.bukti_diminta)}</div>`:'')+`<div class="ans"></div></div>`}).join('')+`</div>`).join('')}
function view(){if(SHOWALL)return allHtml();const s=STEPS[ST.i];
 if(s.t==='fac')return`<div class="card"><span class="chip">Kuesioner Penelitian</span><h1 style="font-size:clamp(24px,5.4vw,32px)">${esc(D.judul)}</h1><p class="lead">${esc(CONFIG.tujuan)}</p>
 <div class="note"><b>Petunjuk pengisian.</b> Kuesioner terdiri dari 24 butir terpilih dalam 12 bagian, dijawab satu per satu; estimasi waktu 10–20 menit. Ke-24 butir dipilih dari bank instrumen penelitian dan kodenya mengikuti dokumen induk, sehingga penomoran tampak tidak berurutan — bukan ada pertanyaan yang hilang. Jawaban tersimpan otomatis di perangkat ini dan dapat dilanjutkan kemudian. Pada sejumlah butir diminta bukti pendukung: bukti ditunjukkan kepada peneliti saat pengisian dan nomor/keterangannya dicatat pada kolom yang disediakan.</div>
 <div class="legend"><b>Y</b>Ya &nbsp;<b>T</b>Tidak &nbsp;<b>BDD</b>Belum Dapat Ditentukan &nbsp;<b>TB</b>Tidak Berlaku &nbsp;<b>★</b>Bukti utama</div>
 <p class="note"><b>Persetujuan.</b> Dengan melanjutkan, Bapak/Ibu menyatakan bersedia mengisi kuesioner ini secara sukarela. Jawaban hanya digunakan untuk keperluan penelitian ini dan identitas responden dirahasiakan dalam pelaporan hasil.</p>
 <div class="gl" style="text-align:left">Pilih fasilitas tempat pengisian</div><div class="fac">${['RSDK','RSGM'].map(f=>`<button class="fc${ST.fac===f?' on':''}" data-a="fac" data-f="${f}"><b>${f}</b><span>${f==='RSDK'?'Rumah Sakit dr. Kariadi':'Rumah Sakit Gigi dan Mulut'}</span></button>`).join('')}</div>
 <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px"><button class="btn" data-a="all">Baca semua pertanyaan</button></div></div>`;
 if(s.t==='who')return`<div class="card"><span class="chip">Langkah 2 dari 2</span><h1>Identitas Responden</h1><p class="lead">Nama wajib diisi. Jabatan dan kontak bersifat opsional dan hanya digunakan peneliti untuk klarifikasi jawaban bila diperlukan.</p><div class="frow" style="margin-top:0"><label class="fl" style="flex-basis:100%"><span>Nama responden * (wajib)</span><input class="in" id="nm" data-a="meta" data-k="nama" value="${esc(ST.who.nama)}" autocomplete="name"></label><label class="fl"><span>Jabatan / peran</span><input class="in" data-a="meta" data-k="jabatan" value="${esc(ST.who.jabatan)}"></label><label class="fl"><span>No. HP / email</span><input class="in" data-a="meta" data-k="kontak" value="${esc(ST.who.kontak)}"></label></div>${ERR?`<div class="er">${ERR}</div>`:''}</div>`;
 if(s.t==='intro'){const x=s.s;return`<div class="card"><span class="chip">Bagian ${esc(x.b)}</span><h1 style="font-size:clamp(23px,5vw,30px)">${esc(x.t)}</h1><p class="lead">Bagian ${SEC.indexOf(x)+1} dari ${SEC.length} · ${x.items.length} pertanyaan · estimasi ±${Math.max(1,Math.round(x.items.length*0.6))} menit</p><div class="gl">Pertanyaan pada bagian ini</div>${x.items.map(it=>`<p class="sec-q"><b>${esc(it.kode_blanko||it.kode)}.</b> ${esc(it.pertanyaan_singkat||it.pertanyaan)}</p>`).join('')}</div>`}
 if(s.t==='q')return qh(s.it);
 const t=total(),miss=SEC.map(x=>({x,m:x.items.filter(it=>!fmt(it))})).filter(z=>z.m.length),pend=window.KuesionerSheets?KuesionerSheets.ambilAntrianTertunda().length:0;
 const ok=RES&&RES.ok;
 return`<div class="card">${ok?`<svg class="ck-svg" viewBox="0 0 84 84"><circle cx="42" cy="42" r="40"/><path d="M24 43l12 12 24-26"/></svg><h1 style="text-align:center">Terima kasih.</h1><p class="lead" style="text-align:center">Jawaban Bapak/Ibu telah kami terima dan sangat membantu penelitian ini.</p>`:`<h1>Tinjau &amp; Kirim</h1><p class="lead">Periksa ringkasan jawaban di bawah. Ketuk butir mana pun untuk mengubah jawabannya. Semua pertanyaan wajib diisi sebelum jawaban dapat dikirim.</p><p class="note">Jawaban akan dikirim kepada peneliti dan tersimpan pada lembar data penelitian. Pastikan ringkasan sudah benar sebelum menekan tombol Kirim.</p>`}
 <div class="stats" style="margin-top:14px"><div class="card"><div class="num">${t}</div>terisi</div><div class="card"><div class="num">${IT.length-t}</div>belum</div><div class="card"><div class="num" style="font-size:24px;padding:5px 0">${ST.fac||'—'}</div>${esc(ST.who.nama||'')}</div></div>
 ${RES?`<div class="al${ok?'':' w'}"><b>${esc(RES.status)}</b><br>${esc(RES.pesan)}</div>`:''}${pend?`<div class="al w">${pend} pengiriman tertunda dan tersimpan di perangkat ini. <button class="lk" data-a="retry">Kirim ulang</button></div>`:''}
 ${ok?`<button class="btn big" data-a="reset">Isi kuesioner baru</button>`:''}
 </div>
 <div class="card" style="margin-top:14px"><b>Ringkasan jawaban</b><p class="hint" style="margin:4px 0 6px">Fasilitas: ${esc(ST.fac||'—')} · Responden: ${esc(ST.who.nama||'—')}${ST.who.jabatan?', '+esc(ST.who.jabatan):''}</p>${SEC.map(x=>`<div class="rv-sec"><h3>Bagian ${esc(x.b)} — ${esc(x.t)}</h3>${x.items.map(it=>{const a=fmt(it),e=(ST.ev[it.kode]||'').trim();return`<button class="rv-it" data-a="jump" data-c="${it.kode}"><code>${esc(it.kode_blanko||it.kode)}</code><span style="flex:1">${esc(it.pertanyaan_singkat||it.pertanyaan)}<span class="a">${a?esc(a):'<span class="none">Belum diisi</span>'}</span>${e?`<span class="e">Bukti: ${esc(e)}</span>`:''}</span></button>`}).join('')}</div>`).join('')}</div>
 ${miss.length&&!ok?`<div class="card" style="margin-top:14px"><b>Belum terisi</b>${miss.map(z=>`<div style="margin-top:8px"><small style="color:var(--mut)">Bagian ${z.x.b}</small><br>${z.m.map(it=>`<button class="lk" data-a="jump" data-c="${it.kode}">${esc(it.kode_blanko||it.kode)}</button>`).join('')}</div>`).join('')}</div>`:''}`}
function segs(){const cur=STEPS[ST.i].s?STEPS[ST.i].s.b:'',e=$('sg');
 if(e.children.length!==SEC.length)e.innerHTML=SEC.map(x=>`<button class="sg" data-a="sec" data-i="${STEPS.findIndex(z=>z.t==='intro'&&z.s===x)}" title="${esc(x.t)}" aria-label="Bagian ${x.b}"><i></i></button>`).join('');
 SEC.forEach((x,k)=>{const n=cnt(x),b=e.children[k];b.classList.toggle('cur',x.b===cur);b.classList.toggle('full',n===x.items.length);b.firstChild.style.width=n/x.items.length*100+'%'})}
const hint=it=>{if(it.kode==='B-01')return`<p class="hint">Pertanyaan ini terdiri dari dua bagian dan keduanya wajib dijawab. Skala 1–5: 1 = tidak pernah, 2 = jarang, 3 = kadang-kadang, 4 = sering, 5 = selalu (setiap hari). Di bawah skala, pilih pula status pencatatannya.</p>`;
 const p=P(it);if(p.filter(x=>x.k==='opt'||x.k==='fld').length>1)return`<p class="hint">Pertanyaan ini terdiri dari beberapa bagian — jawab semuanya sebelum melanjutkan.</p>`;
 const g=p.find(x=>x.k==='opt');return g&&p.length===1?`<p class="hint">${g.multi?'Boleh pilih lebih dari satu.':'Pilih satu jawaban.'}</p>`:''};
function chrome(){if(SHOWALL){$('sl').textContent='Penelaahan seluruh pertanyaan';$('bi').innerHTML=`<button class="btn bk" data-a="alloff" aria-label="Kembali">←</button><button class="btn" data-a="alloff">Kembali ke pengisian</button>`;return}
 const s=STEPS[ST.i],cur=s.s?s.s.b:'';
 segs();
 $('sl').textContent=s.t==='q'||s.t==='intro'?`Bagian ${s.s.b} · ${s.t==='q'?(s.s.items.indexOf(s.it)+1)+' dari '+s.s.items.length:'pengantar'} · ${total()}/${IT.length} terisi`:s.t==='review'?'Tinjau & kirim':'Langkah '+(ST.i+1)+' dari 2';
 const q=s.t==='q',ans=q&&fmt(s.it);let pri,sk='';
 if(s.t==='fac')pri=`<button class="btn p" data-a="next"${ST.fac?'':' disabled'}>Lanjut →</button>`;
 else if(s.t==='intro')pri=`<button class="btn p rdy" data-a="next">Mulai Bagian ${s.s.b} →</button>`;
 else if(s.t==='review')pri=RES&&RES.ok?`<button class="btn p" data-a="reset">Isi kuesioner baru</button>`:`<button class="btn p rdy" id="send" data-a="kirim">Kirim jawaban ➤</button>`;
 else{pri=`<button class="btn p${ans?' rdy':''}" id="pn" data-a="next">Lanjut →</button>`;if(q)sk=`<button class="btn g" id="sk" data-a="skip"${ans?' hidden':''}>Lewati</button>`}
 $('bi').innerHTML=`<button class="btn bk" data-a="back" aria-label="Kembali"${ST.i?'':' disabled'}>←</button>${sk}${pri}`}
function draw(dir){const e=$('st');e.className='st';e.innerHTML=view();if(dir){void e.offsetWidth;e.className='st '+(dir>0?'f':'b')}chrome();
 if(STEPS[ST.i].t==='who'&&!ST.who.nama)setTimeout(()=>{const n=$('nm');n&&n.focus({preventScroll:true})},450)}

function maybeLock(){const locked=(RES&&RES.ok&&STEPS[ST.i].t==='review')||($('dr')&&$('dr').classList.contains('on'));const d=document.documentElement,b=document.body;if(locked){if(d.style.overflow!=='hidden'){const sb=window.innerWidth-d.clientWidth;d.dataset.sb=sb;if(sb)b.style.marginRight=sb+'px';const bt=document.querySelector('.bar');if(bt&&sb)bt.style.right=sb+'px'}d.style.overflow='hidden';b.style.overflow='hidden'}else{if(d.style.overflow==='hidden'){d.style.overflow='';b.style.overflow='';b.style.marginRight='';const bt=document.querySelector('.bar');if(bt)bt.style.right='';delete d.dataset.sb}}}
function go(i,dir,fromPop){ST.i=Math.max(0,Math.min(STEPS.length-1,i));ERR='';draw(dir===undefined?(i>=0?1:-1):dir);scrollTo({top:0});save();drawer(false);if(!fromPop){try{history.pushState({i:ST.i},'')}catch(e){}}}
window.addEventListener('popstate',()=>{if(SHOWALL){SHOWALL=false;draw(0);return}if(ST.i>0)go(ST.i-1,-1,true)});
try{history.replaceState({i:ST.i},'')}catch(e){}
function next(){const s=STEPS[ST.i];if(s.t==='fac'&&!ST.fac){toast('Pilih fasilitas terlebih dahulu: RSDK atau RSGM.');return}
 if(s.t==='who'&&!ST.who.nama.trim()){ERR='Nama responden wajib diisi.';draw(0);return}
 if(s.t==='q'){if(!complete(s.it)){ERR='Pertanyaan ini belum dijawab lengkap. Mohon isi terlebih dahulu, atau tekan “Lewati” bila memang belum dapat dijawab saat ini.';draw(0);return}
  if(s.it.kode==='K-04'&&!ST.k4agree){ERR='Mohon centang pernyataan kebenaran pada butir ini terlebih dahulu.';draw(0);return}}
 go(ST.i+1,1)}
let tm;function save(){clearTimeout(tm);tm=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}},300)}
function toast(m){const t=$('ts');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2400)}
function drawer(on){$('ov').classList.toggle('on',on);const d=$('dr');d.classList.toggle('on',on);maybeLock();if(on)d.innerHTML=`<h2 style="margin:4px 8px 12px">Bagian kuesioner</h2>`+SEC.map(s=>{const n=cnt(s),ix=STEPS.findIndex(x=>x.t==='intro'&&x.s===s);return`<button class="di${n===s.items.length?' d':''}" data-a="sec" data-i="${ix}"><b>${n===s.items.length?'✓':s.b}</b><span>${esc(s.t)}</span><small>${n}/${s.items.length}</small></button>`}).join('')+`<button class="di" data-a="sec" data-i="${STEPS.length-1}"><b>➤</b><span>Tinjau &amp; kirim</span></button><button class="di" data-a="all"><b>≡</b><span>Baca semua pertanyaan</span></button>`}

/* interaksi */
document.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b)return;const r=b.getBoundingClientRect(),z=Math.max(r.width,r.height)*2,s=document.createElement('span');s.className='rp';s.style.cssText=`width:${z}px;height:${z}px;left:${e.clientX-r.left-z/2}px;top:${e.clientY-r.top-z/2}px`;b.appendChild(s);setTimeout(()=>s.remove(),620)});
$('mb').onclick=()=>drawer(true);$('ov').onclick=()=>drawer(false);
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
 if(a==='tog'){const c=t.dataset.c,gi=+t.dataset.g,i=+t.dataset.i,it=BY[c],g=P(it)[gi],st=S(c),k='g'+gi;let sel=st[k]||[];const was=sel.includes(i);
  if(was)sel=sel.filter(x=>x!==i);else if(!g.multi)sel=[i];else sel=EXC.test(g.opts[i].l)?[i]:sel.filter(x=>!EXC.test(g.opts[x].l)).concat(i);
  if(!was&&it.kode==='K-02'&&sel.length>3){toast('Maksimal 3 pilihan untuk pertanyaan ini.');return}
  st[k]=sel;ERR='';const y=scrollY;$('st').innerHTML=view();scrollTo(0,y);chrome();save();
  const nb=document.querySelector(`[data-a=tog][data-c="${c}"][data-g="${gi}"][data-i="${i}"]`);nb&&nb.classList.add('pulse')}
 else if(a==='fac'){ST.fac=t.dataset.f;document.querySelectorAll('.fc').forEach(b=>b.classList.toggle('on',b===t));save();chrome()}
 else if(a==='all'){SHOWALL=true;draw(0);scrollTo({top:0})}
 else if(a==='alloff'){SHOWALL=false;draw(0);scrollTo({top:0})}
 else if(a==='next')next();else if(a==='skip'){ERR='';go(ST.i+1,1)}else if(a==='back')go(ST.i-1,-1);
 else if(a==='sec')go(+t.dataset.i,1);
 else if(a==='jump'){go(STEPS.findIndex(x=>x.t==='q'&&x.it.kode===t.dataset.c),-1)}
 else if(a==='reset'){if(confirm('Hapus semua jawaban di perangkat ini dan mulai pengisian baru?')){try{localStorage.removeItem(KEY);localStorage.removeItem(SKEY)}catch(e){}ST={i:0,fac:'',who:{nama:'',jabatan:'',kontak:''},s:{},ev:{},k4agree:false};RES=null;SHOWALL=false;go(0,-1)}}
 else if(a==='kirim')kirim();
 else if(a==='retry'){t.disabled=true;KuesionerSheets.kirimUlangAntrianTertunda().then(()=>draw(0))}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.a==='k4'){ST.k4agree=t.checked;if(t.checked)ERR='';save()}});
document.addEventListener('input',e=>{const t=e.target,a=t.dataset.a;if(!a)return;
 if(a==='meta'&&t.dataset.k==='nama'&&t.value.trim()&&ERR){ERR='';const er=document.querySelector('.er');er&&er.remove()}
 if(a==='txt')S(t.dataset.c)[t.dataset.k]=t.value;else if(a==='ev')ST.ev[t.dataset.c]=t.value;else if(a==='meta')ST.who[t.dataset.k]=t.value;
 if(a==='txt'){segs();const an=!!fmt(BY[t.dataset.c]),k=$('sk'),p=$('pn');if(k)k.hidden=an;if(p)p.classList.toggle('rdy',an)}save()});
document.addEventListener('keydown',e=>{const tg=e.target.tagName,typing=tg==='INPUT'||tg==='TEXTAREA',t=STEPS[ST.i].t;
 if(e.key==='Escape')return drawer(false);
 if(e.key==='Enter'&&!e.shiftKey&&tg!=='TEXTAREA'&&tg!=='BUTTON'&&t!=='review'&&t!=='fac'){e.preventDefault();next()}
 if(!typing&&t==='q'){const g=document.querySelector('#st .opts');if(/^[1-9]$/.test(e.key)){g&&g.children[+e.key-1]&&g.children[+e.key-1].click()}else if(e.key==='ArrowRight')next();else if(e.key==='ArrowLeft')go(ST.i-1,-1)}});

/* kirim & ekspor (kompatibel sheets-config.js / Code.gs) */
function kumpulkanJawabanKuesioner(){const answers={},evidence={};IT.forEach(it=>{answers[it.kode]=fmt(it);const e=(ST.ev[it.kode]||'').trim();if(e)evidence[it.kode]=e});
 return{facility:ST.fac,timestamp:new Date().toISOString(),respondent:{nama:ST.who.nama.trim(),jabatan:ST.who.jabatan.trim(),kontak:ST.who.kontak.trim()},answers,evidence,status:'Terkirim'}}
function tampilkanStatus(r){RES=r;if(r&&r.ok){try{localStorage.setItem(SKEY,JSON.stringify({at:new Date().toISOString(),fac:ST.fac,nama:ST.who.nama}))}catch(e){}}maybeLock();draw(r.ok?1:0)}
async function kirim(){if(RES&&RES.ok){toast('Jawaban sudah terkirim dari perangkat ini.');return}
 if(!ST.fac||!ST.who.nama.trim()){go(ST.fac?1:0,-1);return}
 const miss=IT.filter(it=>!complete(it)||(it.kode==='K-04'&&!ST.k4agree));
 if(miss.length){
   const k=miss[0].kode;
   const t=STEPS.findIndex(x=>x.t==='q'&&x.it.kode===k);
   if(t>=0){
     toast('Masih ada '+miss.length+' pertanyaan yang belum lengkap — Anda diarahkan ke pertanyaan pertama yang belum lengkap.');
     go(t,-1);
   } else {
     toast('Mohon lengkapi semua pertanyaan terlebih dahulu.');
   }
   scrollTo({top:0});return;
 }
 const b=$('send');b.disabled=true;b.textContent='Mengirim…';
 try{tampilkanStatus(await kirimHasilKeSheets(kumpulkanJawabanKuesioner()))}catch(e){tampilkanStatus({ok:false,status:'Gagal',pesan:String(e)})}scrollTo({top:0,behavior:'smooth'})}
document.addEventListener('focusin',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName))setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),320)});
draw(0);if(RESUMED)toast('Draf sebelumnya dilanjutkan dari pertanyaan terakhir.');
</script>
